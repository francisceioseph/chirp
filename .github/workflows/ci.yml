name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  # O núcleo em Rust, sozinho: formato, clippy e testes.
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # O libsignal compila os .proto dele com o protoc.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # O cpal (o som das notas de voz) usa o ALSA no Linux.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # O app no Linux: análise, testes e o build com o núcleo dentro.
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # O libsignal compila os .proto dele com o protoc.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev libasound2-dev ninja-build cmake clang pkg-config rpm desktop-file-utils appstream
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: The generated translations match the ARB files
        run: git diff --exit-code -- 'lib/l10n/*.dart'
      - name: Test
        run: flutter test --concurrency=2
      - name: Build
        run: flutter build linux --release
      # Os pacotes montam? A versão sai deles no packages.yml.
      - name: Packages
        run: |
          desktop-file-validate linux/packaging/org.psito.chirp.desktop
          appstreamcli validate --no-net linux/packaging/org.psito.chirp.metainfo.xml
          tool/build-deb.sh build/deb --no-build
          tool/build-rpm.sh build/rpm --no-build
          dpkg-deb -c build/deb/*.deb | grep 'usr/bin/psito-chirp' >/dev/null
          rpm -qlp build/rpm/*.rpm | grep '/usr/bin/psito-chirp' >/dev/null

  # A versão é a última tag: feat sobe o minor, fix o patch e BREAKING CHANGE o major
  # (.releaserc.json). O tool/set-version.sh grava no app e no núcleo, e o commit da
  # versão volta para a master: rode git pull --rebase antes de cada push.
  release:
    needs: [core, app]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.new_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and publish the release
        run: >-
          npx --yes
          -p semantic-release@24.2.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: The tag, if this run made one
        id: new_tag
        run: |
          tag="$(git tag --points-at HEAD 'v*' | head -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Os instaladores e os repositórios da versão nova (packages.yml).
  packages:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # A ponte compila nas outras quatro plataformas? É o risco que a fase 0 quer medir
  # cedo (docs/PLANO.md, 13). Os apps ficam nos artefatos do run.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - name: macos
            os: macos-latest
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release
          - name: android
            os: ubuntu-24.04
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk
          - name: ios
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # O libsignal compila os .proto dele com o protoc.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Build
        run: ${{ matrix.command }}
      # O flutter esconde o erro do Rust atrás do aviso de assinatura.
      - name: Rust errors
        if: failure() && matrix.name == 'ios'
        run: |
          rustup target add aarch64-apple-ios
          CARGO_TERM_COLOR=never cargo build --manifest-path core/chirp-core/Cargo.toml --release \
            --target aarch64-apple-ios 2>&1 | grep -E -A25 "^error" | head -150
      - uses: actions/upload-artifact@v4
        with:
          name: psito-chirp-${{ matrix.name }}
          path: ${{ matrix.artifact }}
