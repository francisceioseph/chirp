name: psito_chirp
description: "Mensageiro privado, ponto a ponto e sem servidor."
publish_to: 'none'
version: 0.3.0

environment:
  sdk: ^3.13.3

dependencies:
  chirp_core:
    path: rust_builder
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  intl: any
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/chirp_icon.svg
