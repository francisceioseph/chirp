[package]
name = "chirp_mailbox"
version = "0.10.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A caixa postal do Psito Chirp: guarda envelopes já cifrados para quem está offline."

[lib]
path = "src/lib.rs"

[[bin]]
name = "chirp-mailbox"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# O servidor (o binário). O núcleo do app usa só o protocolo e o link.
server = ["dep:iroh", "dep:qrcode", "dep:getrandom", "tokio/rt-multi-thread", "tokio/signal", "tokio/fs"]

[dependencies]
base64 = "0.23.1"
prost = { version = "0.14.5", default-features = false, features = ["derive", "std"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "sync", "time", "macros"] }
getrandom = { version = "0.4.3", optional = true }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"], optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
