[workspace]
resolver = "2"
members = ["chirp-core"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/francisceioseph/chirp"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"

# As dependências otimizadas também em desenvolvimento: sem isso, o Argon2 (64 MiB, 3
# passadas) leva dezenas de segundos no build de debug do app.
[profile.dev.package."*"]
opt-level = 3

# O netdev 0.46.x (do netwatch, do iroh) usa o `libc::in6_ifreq` no iOS, que o libc só
# declara no macOS, e o build de iOS não compila. A cópia em `vendor/netdev` declara a
# struct ela mesma. Sai quando o netwatch aceitar um netdev corrigido.
[patch.crates-io]
netdev = { path = "vendor/netdev" }
