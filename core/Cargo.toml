[workspace]
resolver = "2"
members = ["chirp-core"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/francisceioseph/chirp"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"

# As dependências otimizadas também em desenvolvimento: sem isso, o Argon2 (64 MiB, 3
# passadas) leva dezenas de segundos no build de debug do app.
[profile.dev.package."*"]
opt-level = 3
