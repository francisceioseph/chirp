[workspace]
resolver = "2"
members = ["chirp-core"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/francisceioseph/chirp"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"

# As dependências otimizadas também em desenvolvimento: sem isso, o Argon2 (64 MiB, 3
# passadas) leva dezenas de segundos no build de debug do app.
[profile.dev.package."*"]
opt-level = 3

# O libc 0.2.191 só declara no macOS o que o iroh usa das rotas e das interfaces, e o
# build de iOS não compila. As cópias em `vendor/` declaram elas mesmas: o netdev
# 0.46.x, a struct `in6_ifreq`, e o netwatch 0.19.3, as constantes do `net/route.h`
# (`src/sys.rs`). Saem quando os dois corrigirem.
[patch.crates-io]
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }
