[package]
name = "chirp_core"
version = "0.11.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "O núcleo do Psito Chirp: criptografia, rede e armazenamento."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = { version = "0.6.0", features = ["zeroize"] }
async-trait = "0.1.92"
base64 = "0.23.1"
blake3 = "1.8.7"
flutter_rust_bridge = "=2.13.0"
futures = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
# Só para tirar os metadados das fotos e fazer a miniatura, no aparelho.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
mdns-sd = { version = "0.21.7", default-features = false, features = ["async"] }
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.107.0", version = "0.1.0" }
prost = { version = "0.14.5", default-features = false, features = ["derive", "std"] }
rand = "0.9"
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"
cpal = "0.18.2"
opus = "0.4.0"
ogg = "0.9.2"

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
# O retransmissor dos testes e a confiança no certificado dele; só nos testes.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "test-utils"] }
tempfile = "3.27.0"
